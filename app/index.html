<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Vaglio: fai valutare le tue pubblicità da persone vere prima di investirci.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vaglio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vaglio</title>
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Schermata di caricamento: visibile subito, sparisce quando l'app è pronta. */
    html, body { margin: 0; background: #0D0B14; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F4F1FA; text-align: center; transition: opacity .3s;
    }
    #loading h1 { margin: 0; font-size: 34px; font-weight: 500; }
    #loading p { margin: 0; color: #A39DB5; font-size: 15px; max-width: 360px; line-height: 1.5; }
    #loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 4px solid #2C2640; border-top-color: #7C5CFF; animation: spin 0.9s linear infinite;
    }
    #loading .slow { display: none; font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="" width="88" height="88" style="border-radius:20px">
    <h1>Vaglio</h1>
    <div class="spinner"></div>
    <p>Caricamento… può richiedere qualche secondo.</p>
    <p class="slow" id="slow">
      Ci sta mettendo più del previsto. Alcune reti (scuole, uffici) bloccano questo sito:
      prova con i dati del telefono o con un altro browser.
    </p>
  </div>
  <noscript><p style="color:#fff;text-align:center">Per usare Vaglio attiva JavaScript nel browser.</p></noscript>
  <script>
    setTimeout(function () {
      var slow = document.getElementById('slow');
      if (slow) slow.style.display = 'block';
    }, 20000);
    // Flutter lancia questo evento quando ha disegnato la prima schermata.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
